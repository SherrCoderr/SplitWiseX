spring:
  application:
    name: splitwisex-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME:splitwisex}
    username: ${DB_USER:splitwisex}
    password: ${DB_PASSWORD:splitwisex}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate, not update/create — Flyway owns the schema
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# Used from Stage 2 onward by the JWT filter
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.splitwisex: DEBUG
