spring:
  application:
    name: splitwisex-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:splitwisex}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:splitwisex}
    password: ${DB_PASSWORD:splitwisex}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.splitwisex: DEBUG