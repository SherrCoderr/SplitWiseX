version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: splitwisex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitwisex
      POSTGRES_USER: splitwisex
      POSTGRES_PASSWORD: splitwisex
    ports:
      - "5433:5432"
    volumes:
      - splitwisex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitwisex -d splitwisex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  splitwisex_pg_data:
